[project]
name = "trax-os-api"
version = "0.1.0"
description = "Trax OS public API foundation"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic==1.16.1",
  "argon2-cffi==23.1.0",
  "asyncpg==0.30.0",
  "email-validator==2.2.0",
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn[standard]==0.34.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.0",
  "pytest==8.4.0",
  "pytest-cov==6.1.1",
  "ruff==0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trax_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=trax_api --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trax_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
