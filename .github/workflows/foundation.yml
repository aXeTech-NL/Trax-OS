name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      contract_base_sha:
        description: Trusted 40-character Git commit containing the base OpenAPI contract
        required: true
        type: string

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAX_DATABASE_URL: postgresql+asyncpg://trax_app:trax-application-ci-only@127.0.0.1:5432/trax
      TRAX_ADMIN_DATABASE_URL: postgresql+asyncpg://trax_admin:trax-admin-ci-only@127.0.0.1:5432/trax
      TRAX_MIGRATION_DATABASE_URL: postgresql+asyncpg://trax_admin:trax-admin-ci-only@127.0.0.1:5432/trax
      TRAX_SESSION_COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:0d14e6c83a1bde7e453c2a5fb41785279992cb5793073a686f4f9e8ec2c5b077
        env:
          POSTGRES_DB: trax
          POSTGRES_USER: trax_admin
          POSTGRES_PASSWORD: trax-admin-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trax_admin -d trax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Provision fixed non-superuser runtime database role
        env:
          TRAX_RUNTIME_DB_USER: trax_app
          TRAX_RUNTIME_DB_PASSWORD: trax-application-ci-only
        run: |
          database_id="$(docker ps --filter publish=5432 --format '{{.ID}}')"
          test -n "$database_id"
          docker exec -i --user postgres \
            -e TRAX_RUNTIME_DB_USER \
            -e TRAX_RUNTIME_DB_PASSWORD \
            "$database_id" sh -s < apps/api/postgres/00-runtime-role.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: make bootstrap
      - name: Migrate empty PostgreSQL database
        run: make db-migrate
      - name: Verify migration metadata has no drift
        run: make db-check
      - name: Run foundation checks and production build
        run: make check
      - name: Reject incompatible public API changes
        env:
          CONTRACT_BASE_SHA: ${{ inputs.contract_base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$CONTRACT_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$CONTRACT_BASE_SHA" =~ ^0+$ ]]; then
            echo "A trusted 40-character base commit is required." >&2
            exit 1
          fi
          git show "$CONTRACT_BASE_SHA:packages/api-contract/generated/openapi.json" \
            > "$RUNNER_TEMP/base-openapi.json"
          make contract-compat BASE_CONTRACT="$RUNNER_TEMP/base-openapi.json"
      - name: Prove production PWA navigation works offline
        run: npm run test:pwa --workspace @trax-os/web
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Validate development Compose configuration
        run: make compose-config
      - name: Verify generated files and formatting leave no diff
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"

  compose-evaluation:
    name: Clean Compose boot and smoke
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: trax-os-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "55432"
      TRAX_WEB_PORT: "18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate and boot the empty evaluation stack
        run: |
          make compose-config
          make compose-up
      - name: Run schema-backed same-origin smoke
        run: make compose-smoke
      - name: Prove the built web client executes through Compose
        env:
          TRAX_PWA_ORIGIN: http://127.0.0.1:18080
        run: npm run test:pwa --workspace @trax-os/web
      - name: Verify migration, users and loopback-only ports
        run: |
          migration_id="$(docker compose --env-file .env.example ps -a -q migration)"
          test -n "$migration_id"
          test "$(docker inspect --format '{{.State.Status}}:{{.State.ExitCode}}' "$migration_id")" = "exited:0"
          api_id="$(docker compose --env-file .env.example ps -q api)"
          test -n "$api_id"
          test "$(docker compose --env-file .env.example exec -T api id -u)" != "0"
          test "$(docker compose --env-file .env.example exec -T web id -u)" != "0"
          test "$(docker compose --env-file .env.example port database 5432)" = "127.0.0.1:55432"
          test "$(docker compose --env-file .env.example port web 8080)" = "127.0.0.1:18080"
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$api_id")" = "{}"
          test "$(docker compose --env-file .env.example exec -T database \
            psql -U trax_admin -d trax -Atc \
            \"SELECT rolname || ':' || rolsuper || ':' || rolbypassrls FROM pg_roles WHERE rolname='trax_app'\")" \
            = "trax_app:false:false"
      - name: Show bounded Compose diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=200
      - name: Remove the isolated evaluation stack
        if: always()
        run: |
          CONFIRM_COMPOSE_CLEAN=1 make compose-clean
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
