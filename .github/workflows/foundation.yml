name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: make bootstrap
      - name: Run foundation checks
        run: make check
      - name: Validate development Compose configuration
        run: make compose-config
      - name: Check whitespace
        run: git diff --check
