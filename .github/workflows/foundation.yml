name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install locked dependencies
        run: make bootstrap
      - name: Run foundation checks and production build
        run: make check
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Validate development Compose configuration
        run: make compose-config
      - name: Verify generated files and formatting leave no diff
        run: |
          git diff --check
          git diff --exit-code
